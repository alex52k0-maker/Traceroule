name: 1 - Créer la clé de signature (une seule fois)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Générer la clé
        run: |
          set -e
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore upload.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Trace et Roule, O=Perso, C=FR" > /dev/null 2>&1
          B64=$(base64 -w0 upload.jks)
          {
            echo "KEYSTORE_BASE64=$B64"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=upload"
            echo "KEY_PASSWORD=$PASS"
          } > keystore-info.txt
          {
            echo "### Empreinte SHA-1 de ta clé (pour Google Cloud)"
            echo '```'
            keytool -list -v -keystore upload.jks -storepass "$PASS" | grep -E "SHA1|SHA256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: cle-de-signature
          path: |
            upload.jks
            keystore-info.txt
          retention-days: 3
