<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#120f2b">
<title>Trace & Roule</title>
<script src="config.js"></script>
<style>
  :root {
    --bg: #120f2b;
    --panel: rgba(255,255,255,.07);
    --panel-2: rgba(255,255,255,.12);
    --text: #f7f6ff;
    --muted: #a9a6d6;
    --ink: #ffd166;
    --goal: #06d6a0;
    --danger: #ff4d78;
    --violet: #7c6cff;
    --radius: 20px;
    --banner: 0px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Avenir Next", "Nunito", "Trebuchet MS", system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 14px + var(--banner));
    animation: screenIn .4s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes screenIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  .hidden { display: none !important; }
  h1 { font-size: 46px; line-height: 1; margin: 0 0 10px; font-weight: 900; letter-spacing: -1.5px; }
  h2 { font-size: 22px; margin: 0; font-weight: 900; }
  p { margin: 0; color: var(--muted); line-height: 1.4; }

  button {
    font: inherit; font-weight: 800; color: var(--text); background: var(--panel-2);
    border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer;
    transition: transform .12s cubic-bezier(.3,1.6,.5,1), background .2s, filter .2s, box-shadow .2s;
  }
  button:active { transform: scale(.93); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.primary {
    background: linear-gradient(135deg, #ffd166, #ff9f43); color: #3a2400;
    box-shadow: 0 6px 20px rgba(255,159,67,.35), inset 0 -3px 0 rgba(0,0,0,.12);
  }
  button.ghost { background: transparent; color: var(--muted); }
  button:disabled { opacity: .4; }
  button.pulse { animation: pulseBtn 1.6s ease-in-out infinite; }
  @keyframes pulseBtn { 0%,100% { box-shadow: 0 6px 20px rgba(255,159,67,.35), 0 0 0 0 rgba(255,209,102,.55); } 50% { box-shadow: 0 6px 20px rgba(255,159,67,.35), 0 0 0 12px rgba(255,209,102,0); } }

  /* ---------- Connexion ---------- */
  #login { justify-content: center; align-items: center; text-align: center; gap: 26px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #3a2a8a 0%, #1b1450 45%, #0d0a24 100%); }
  #login::before, #login::after { content: ""; position: absolute; border-radius: 50%; filter: blur(50px); opacity: .55; animation: drift 9s ease-in-out infinite alternate; }
  #login::before { width: 260px; height: 260px; background: #06d6a0; left: -80px; top: 12%; }
  #login::after { width: 300px; height: 300px; background: #ff4d78; right: -110px; bottom: 6%; animation-delay: -4s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,-30px) scale(1.15); } }
  #login > * { position: relative; z-index: 1; }
  .logo { width: 170px; height: 170px; animation: floaty 3.2s ease-in-out infinite; filter: drop-shadow(0 14px 22px rgba(0,0,0,.4)); }
  .logo svg { width: 100%; height: 100%; }
  @keyframes floaty { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  h1 .g { background: linear-gradient(90deg, #ffd166, #ff7eb6, #7c6cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 em { font-style: normal; color: var(--goal); }
  #login .box { display: flex; flex-direction: column; gap: 14px; align-items: center; width: 100%; max-width: 320px; }
  #gbtn { min-height: 44px; display: flex; justify-content: center; }
  #gnote { font-size: 13px; color: var(--muted); }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 300px; background: #fff; color: #1f1f1f; border-radius: 30px; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .gbtn svg { width: 20px; height: 20px; }

  /* ---------- Menu ---------- */
  #menu { background: radial-gradient(120% 60% at 50% 0%, #2a2170 0%, #151038 50%, #0d0a24 100%); }
  .topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #7c6cff, #ff4d78); object-fit: cover; display: grid; place-items: center; font-weight: 900; flex: none; border: 2px solid rgba(255,255,255,.4); }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 14px; color: var(--ink); font-weight: 800; }
  .who small { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span i { font-style: normal; color: var(--muted); font-weight: 600; }
  .topbar button { padding: 10px 12px; font-size: 14px; }
  .pwrap { height: 10px; border-radius: 8px; background: var(--panel); overflow: hidden; margin-bottom: 14px; }
  .pwrap i { display: block; height: 100%; width: 0; border-radius: 8px; background: linear-gradient(90deg, #06d6a0, #ffd166, #ff7eb6); background-size: 200% 100%; animation: shimmer 3s linear infinite; transition: width .8s cubic-bezier(.2,.8,.2,1); }
  @keyframes shimmer { to { background-position: -200% 0; } }
  #worlds { flex: 1; min-height: 0; overflow-y: auto; touch-action: pan-y; padding-bottom: 10px; scrollbar-width: none; }
  #worlds::-webkit-scrollbar { display: none; }
  .world { margin-bottom: 18px; border-radius: 26px; padding: 14px; background: linear-gradient(160deg, color-mix(in srgb, var(--c1) 30%, transparent), color-mix(in srgb, var(--c2) 22%, transparent)); border: 1px solid rgba(255,255,255,.1); }
  .wh { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .wh .wi { font-size: 30px; width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: 0 6px 16px rgba(0,0,0,.3); animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-4px) rotate(4deg); } }
  .wh > div { flex: 1; }
  .wh b { font-size: 19px; display: block; }
  .wh small { color: var(--muted); font-size: 12px; }
  .wst { font-weight: 900; color: var(--ink); font-size: 14px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile { aspect-ratio: 1; padding: 0; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: linear-gradient(160deg, var(--c1), var(--c2)); box-shadow: 0 6px 14px rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.28);
    animation: tileIn .5s cubic-bezier(.3,1.5,.5,1) both; animation-delay: calc(var(--i) * 30ms); }
  @keyframes tileIn { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
  .tile .num { font-size: 24px; font-weight: 900; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .tile small { font-size: 11px; letter-spacing: 1px; color: #fff7c2; min-height: 13px; }
  .tile.locked { background: var(--panel); box-shadow: none; opacity: .55; }
  .tile .lock { font-size: 20px; filter: grayscale(.4); }
  .tile.now { animation: tileIn .5s cubic-bezier(.3,1.5,.5,1) both, nowPulse 1.5s ease-in-out .6s infinite; animation-delay: calc(var(--i) * 30ms), 0s; }
  @keyframes nowPulse { 0%,100% { box-shadow: 0 6px 14px rgba(0,0,0,.28), 0 0 0 0 rgba(255,255,255,.7); } 50% { box-shadow: 0 6px 14px rgba(0,0,0,.28), 0 0 0 9px rgba(255,255,255,0); } }
  .foot { display: flex; justify-content: center; gap: 4px; padding-top: 6px; }
  .foot button { font-size: 13px; padding: 8px 12px; color: var(--muted); font-weight: 700; background: transparent; }

  /* ---------- Jeu ---------- */
  #game { padding-left: 12px; padding-right: 12px; gap: 9px; background: linear-gradient(180deg, var(--top, #12324a), var(--bot, #1f6f6b)); }
  .hud { display: flex; align-items: center; gap: 10px; }
  .hud .title { flex: 1; text-align: center; line-height: 1.15; }
  .hud .title b { display: block; font-size: 18px; font-weight: 900; }
  .hud .title span { font-size: 12px; color: rgba(255,255,255,.75); font-weight: 700; }
  .hud .title.pop { animation: titlePop .7s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes titlePop { from { opacity: 0; transform: scale(.6) translateY(-10px); } to { opacity: 1; transform: none; } }
  .icon-btn { width: 44px; height: 44px; padding: 0; display: grid; place-items: center; font-size: 22px; background: rgba(0,0,0,.28); }
  .ink { height: 12px; border-radius: 8px; background: rgba(0,0,0,.3); overflow: hidden; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .ink i { display: block; height: 100%; width: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--ink), #fff2b8, var(--ink)); background-size: 200% 100%; animation: shimmer 2.2s linear infinite; transition: width .08s linear; }
  .ink.low i { background: linear-gradient(90deg, #ff4d78, #ff9aa8, #ff4d78); background-size: 200% 100%; }
  .ink.low { animation: shake .4s ease-in-out infinite; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  #stage { flex: 1; min-height: 0; display: grid; place-items: center; position: relative; }
  canvas { border-radius: 22px; touch-action: none; box-shadow: 0 10px 30px rgba(0,0,0,.4), 0 0 0 2px rgba(255,255,255,.12); }
  .hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.55); backdrop-filter: blur(6px); padding: 9px 16px; border-radius: 30px; font-weight: 800; font-size: 14px; white-space: nowrap; pointer-events: none; animation: hintBob 1.6s ease-in-out infinite; }
  @keyframes hintBob { 0%,100% { transform: translate(-50%,0); } 50% { transform: translate(-50%,-6px); } }
  #skipRow { display: flex; justify-content: center; animation: screenIn .4s both; }
  .pill { background: rgba(0,0,0,.4); padding: 8px 16px; font-size: 13px; border-radius: 30px; }
  .actions { display: flex; gap: 10px; }
  .actions button { flex: 1; padding: 15px 8px; font-size: 15px; background: rgba(0,0,0,.32); }
  .actions .primary { flex: 1.7; font-size: 16px; background: linear-gradient(135deg, #ffd166, #ff9f43); }
  #bonus { color: var(--ink); }

  #toast { position: fixed; left: 50%; top: 96px; transform: translate(-50%, -14px) scale(.9); background: var(--danger); color: #fff; font-weight: 800; padding: 10px 18px; border-radius: 30px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1); z-index: 20; white-space: nowrap; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  #toast.ok { background: var(--goal); color: #06322a; }
  #toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  #win { position: fixed; inset: 0; background: rgba(8,6,24,.6); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 24px; animation: fade .3s both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  #win .card { background: linear-gradient(160deg, #3b2f8f, #22195e); border: 1px solid rgba(255,255,255,.18); border-radius: 30px; padding: 26px 22px 18px; width: 100%; max-width: 340px; text-align: center; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.5); animation: cardIn .6s cubic-bezier(.3,1.5,.5,1) both; }
  @keyframes cardIn { from { opacity: 0; transform: scale(.6) translateY(40px) rotate(-4deg); } to { opacity: 1; transform: none; } }
  #wbadge { font-size: 54px; line-height: 1; animation: bob 2s ease-in-out infinite; }
  #stars { display: flex; justify-content: center; gap: 8px; }
  #stars i { font-style: normal; font-size: 52px; line-height: 1; color: rgba(255,255,255,.18); transform: scale(.4); opacity: 0; animation: starIn .55s cubic-bezier(.3,1.9,.5,1) both; animation-delay: calc(.35s + var(--k) * .25s); }
  #stars i.on { color: var(--ink); text-shadow: 0 0 18px rgba(255,209,102,.8); }
  @keyframes starIn { from { opacity: 0; transform: scale(2.4) rotate(-40deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
  #win .row { display: flex; gap: 10px; }
  #win .row button { flex: 1; }
  @media (prefers-reduced-motion: reduce) {
    .logo, .wh .wi, #wbadge, .tile.now, button.pulse, .hint, #login::before, #login::after { animation: none !important; }
  }
</style>
</head>
<body>

<!-- CONNEXION -->

    <p id="gnote" class="hidden"></p>
    <button id="guest" class="primary">Jouer maintenant</button>
  </div>
</section>

<!-- MENU -->
<section id="menu" class="screen hidden">
  <div class="topbar">
    <div id="avatar" class="avatar"></div>
    <div class="who"><b id="uname"></b><span id="ustars"></span><small id="cloud" style="text-decoration:underline"></small></div>
    <button id="snd" aria-label="Son">🔊</button>
    <button id="logout" class="ghost">Quitter</button>
  </div>
  <div class="pwrap"><i id="pbar"></i></div>
  <div id="worlds"></div>
  <div class="foot">
    <button id="privacy">Confidentialité</button>
    <button id="adprefs" class="hidden">Préférences de pub</button>
  </div>
</section>

<!-- JEU -->
<section id="game" class="screen hidden">
  <div class="hud">
    <button id="back" class="icon-btn" aria-label="Retour aux niveaux">‹</button>
    <div class="title" id="ltitle"></div>
    <button id="undo" class="icon-btn" aria-label="Annuler le dernier trait">↶</button>
  </div>
  <div class="ink" id="inkwrap" aria-label="Encre restante"><i id="inkbar"></i></div>
  <div id="stage"><canvas id="cv"></canvas><div id="hint" class="hint hidden">✏️ Trace une ligne avec ton doigt</div></div>
  <div id="skipRow" class="hidden"><button id="skip" class="pill">⏭ Passer ce niveau</button></div>
  <div class="actions">
    <button id="clear">Effacer</button>
    <button id="bonus">+40 % encre ▶</button>
    <button id="go" class="primary pulse">Lancer la balle</button>
  </div>
</section>

<div id="toast"></div>

<div id="win" class="hidden">
  <div class="card">
    <div id="wbadge">🏆</div>
    <h2 id="wtitle">Bravo !</h2>
    <div id="stars"></div>
    <p id="wsub"></p>
    <div class="row">
      <button id="wretry">Rejouer</button>
      <button id="wnext" class="primary">Suivant ›</button>
    </div>
    <button id="wmenu" class="ghost">Niveaux</button>
  </div>
</div>

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const progKey = () => "tr_prog_" + (user ? user.id : "guest");
function getProg() {
  const p = store.get(progKey()) || [];
  while (p.length < LEVELS.length) p.push(0);
  return p;
}
function setStars(i, s) {
  const p = getProg();
  if (s > p[i]) { p[i] = s; store.set(progKey(), p); Cloud.push(); }
}
function setSkipped(i) {
  const p = getProg();
  if (p[i] === 0) { p[i] = -1; store.set(progKey(), p); Cloud.push(); }
}
/* fusion de deux progressions : on garde le meilleur résultat de chaque niveau */
function mergeProg(a, b) {
  const n = Math.max(a.length, b.length, LEVELS.length), out = [];
  for (let i = 0; i < n; i++) {
    const x = a[i] || 0, y = b[i] || 0;
    out.push(x > 0 || y > 0 ? Math.max(x, y) : (x === -1 || y === -1 ? -1 : 0));
  }
  return out;
}

/* ---------- Sauvegarde dans le cloud (Firebase : Authentification + Firestore) ---------- */
const Cloud = {
  auth: null, status: "off", msg: "", timer: null, busy: Promise.resolve(),
  cfg() { const f = window.CFG && CFG.FIREBASE; return f && f.apiKey && f.projectId && !/^VOTRE/.test(f.apiKey) ? f : null; },
  enabled() { return !!this.cfg(); },
  async jpost(url, body) {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
    return j;
  },
  /* Connexion : on échange le jeton Google contre une session Firebase */
  async login(idToken) {
    if (!this.enabled() || !user) return;
    if (!idToken) { this.setStatus("relog"); return; }
    try {
      const j = await this.jpost("https://identitytoolkit.googleapis.com/v1/accounts:signInWithIdp?key=" + this.cfg().apiKey, {
        postBody: "id_token=" + encodeURIComponent(idToken) + "&providerId=google.com",
        requestUri: "http://localhost", returnIdpCredential: true, returnSecureToken: true });
      this.auth = { uid: j.localId, token: j.idToken, exp: Date.now() + (parseInt(j.expiresIn || "3600", 10) - 60) * 1000, refresh: j.refreshToken };
      store.set("tr_fb", { uid: j.localId, refresh: j.refreshToken, gid: user.id });
      await this.sync();
    } catch (e) { console.warn("Cloud login", e); this.setStatus("err", e.message); }
  },
  /* Au lancement de l'appli : on reprend la session enregistrée */
  async resume() {
    if (!this.enabled() || !user) return;
    const s = store.get("tr_fb");
    if (!s || s.gid !== user.id) { this.setStatus("relog"); return; }
    this.auth = { uid: s.uid, token: null, exp: 0, refresh: s.refresh };
    await this.sync();
  },
  async token() {
    const a = this.auth; if (!a) throw new Error("no-auth");
    if (a.token && Date.now() < a.exp) return a.token;
    const r = await fetch("https://securetoken.googleapis.com/v1/token?key=" + this.cfg().apiKey, {
      method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: "grant_type=refresh_token&refresh_token=" + encodeURIComponent(a.refresh) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { if (r.status >= 400 && r.status < 500) { store.del("tr_fb"); this.auth = null; throw new Error("session-expired"); } throw new Error("HTTP " + r.status); }
    a.token = j.id_token; a.refresh = j.refresh_token || a.refresh; a.uid = j.user_id || a.uid;
    a.exp = Date.now() + (parseInt(j.expires_in || "3600", 10) - 60) * 1000;
    store.set("tr_fb", { uid: a.uid, refresh: a.refresh, gid: user.id });
    return a.token;
  },
  url() { return "https://firestore.googleapis.com/v1/projects/" + encodeURIComponent(this.cfg().projectId) + "/databases/(default)/documents/users/" + encodeURIComponent(this.auth.uid); },
  async load() {
    const t = await this.token();
    const r = await fetch(this.url(), { headers: { Authorization: "Bearer " + t } });
    if (r.status === 404) return null;
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
    const f = j.fields && j.fields.progress && j.fields.progress.stringValue;
    return f ? JSON.parse(f) : null;
  },
  async save(p) {
    const t = await this.token();
    const r = await fetch(this.url() + "?updateMask.fieldPaths=progress&updateMask.fieldPaths=name&updateMask.fieldPaths=updated", {
      method: "PATCH", headers: { Authorization: "Bearer " + t, "Content-Type": "application/json" },
      body: JSON.stringify({ fields: { progress: { stringValue: JSON.stringify(p) }, name: { stringValue: user.name || "" }, updated: { integerValue: String(Date.now()) } } }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error((j.error && j.error.message) || ("HTTP " + r.status)); }
  },
  /* Synchronisation : on fusionne local + cloud, puis on réécrit si besoin */
  sync() {
    this.busy = this.busy.then(async () => {
      if (!this.enabled() || !user || !this.auth) return;
      this.setStatus("sync");
      try {
        const remote = await this.load();
        const local = getProg(), before = JSON.stringify(local);
        const merged = mergeProg(local, remote || []);
        store.set(progKey(), merged);
        if (!remote || JSON.stringify(mergeProg(remote, [])) !== JSON.stringify(merged)) await this.save(merged);
        this.setStatus("ok");
        if (before !== JSON.stringify(merged) && !$("menu").classList.contains("hidden")) buildMenu();
      } catch (e) {
        console.warn("Cloud sync", e);
        this.setStatus(e.message === "session-expired" ? "relog" : "err", e.message);
      }
    });
    return this.busy;
  },
  push() { clearTimeout(this.timer); this.timer = setTimeout(() => this.sync(), 600); },
  setStatus(s, msg) { this.status = s; this.msg = msg || ""; if (typeof paintCloud === "function") paintCloud(); },
  clear() { this.auth = null; store.del("tr_fb"); this.status = "off"; paintCloud(); }
};

const Snd = {
  on: store.get("tr_snd") !== false, ac: null, last: 0,
  unlock() {
    if (!this.on) return;
    try {
      if (!this.ac) this.ac = new (window.AudioContext || window.webkitAudioContext)();
      if (this.ac.state === "suspended") this.ac.resume();
    } catch (e) {}
  },
  tone(f, d, type, v, slide, delay) {
    if (!this.on || !this.ac) return;
    const a = this.ac, t = a.currentTime + (delay || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(v || .07, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .03);
  },
  pop()    { this.tone(500, .1, "triangle", .07, 380); },
  launch() { this.tone(300, .18, "sawtooth", .04, 500); },
  tick(sp) { const n = performance.now(); if (n - this.last < 70) return; this.last = n; this.tone(260 + Math.min(500, sp * .35), .07, "triangle", .05, -60); },
  boing()  { this.tone(220, .28, "sine", .09, 520); },
  star(k)  { this.tone(660 + k * 190, .32, "triangle", .09, 240); },
  win()    { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .28, "triangle", .08, 0, i * .09)); },
  lose()   { this.tone(300, .45, "sawtooth", .05, -230); },
  set(on)  { this.on = on; store.set("tr_snd", on); if (on) this.unlock(); }
};

function decodeJwt(t) {
  const b = t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
  const json = decodeURIComponent(atob(b).split("").map(c => "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
  return JSON.parse(json);
}
function setUser(p, idToken) {
  const guest = store.get("tr_prog_guest");
  user = { id: p.id || p.sub, name: p.givenName || p.given_name || p.name || "Joueur", picture: p.imageUrl || p.picture || "", email: p.email || "" };
  store.set("tr_user", user);
  // la progression jouée en invité est reprise dans le compte
  if (guest && guest.some(x => x !== 0)) store.set(progKey(), mergeProg(getProg(), guest));
  showMenu();
  Cloud.login(idToken);
}
function onGoogle(resp) {
  try { setUser(decodeJwt(resp.credential), resp.credential); } catch (e) { toast("Connexion impossible"); }
}

/* ---------- Effets ---------- */
const CONF = ["#ffd166", "#ff4d78", "#06d6a0", "#4cc9f0", "#b388ff", "#ffffff"];

}

}
function initFx(w) {

/* ---------- Physique ---------- */
function hit(sp, nx, ny) {

}
function collide(x1, y1, x2, y2, th) {

  ball.x = cx + nx * min; ball.y = cy + ny * min;
  const vn = ball.vx * nx + ball.vy * ny;
  if (vn < 0) {
    const k = Math.abs(vn) < 60 ? 1 : 1 + REST;   // pas de rebond minuscule
    ball.vx -= k * vn * nx; ball.vy -= k * vn * ny;
    const tx = -ny, ty = nx, vt = ball.vx * tx + ball.vy * ty;
    ball.vx -= vt * FRICTION * tx; ball.vy -= vt * FRICTION * ty;

}
function step(dt) {

  for (const w of L.walls) collide(w[0], w[1], w[2], w[3], WALL);
  for (const s of segs) collide(s[0], s[1], s[2], s[3], STROKE);
  if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx) * REST; }
  if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx) * REST; }
  if (L.bumpers) for (let bi = 0; bi < L.bumpers.length; bi++) {
    const b = L.bumpers[bi];
    let nx = ball.x - b[0], ny = ball.y - b[1], d = Math.hypot(nx, ny);
    const min = R + b[2];
    if (d < min) {
      if (d < 1e-6) { nx = 0; ny = -1; d = 0; } else { nx /= d; ny /= d; }
      ball.x = b[0] + nx * min; ball.y = b[1] + ny * min;
      const vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) {
        ball.vx -= 2.15 * vn * nx; ball.vy -= 2.15 * vn * ny;

  }

}

/* ---------- Boucle principale ---------- */
function frame(t) {

function update(dt) {

    bg.addColorStop(0, "#b7adff"); bg.addColorStop(1, "#6a56f0");
    ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(b[0], b[1], b[2] * k, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b[0], b[1], b[2] * .55 * k, 0, 7); ctx.stroke();
  });

  // pièges (pics qui tournent)
  L.hazards.forEach((h0, i) => {
    if (h0[3] || h0[4]) {
      ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 2; ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.moveTo(h0[0] - (h0[3] || 0), h0[1] - (h0[4] || 0)); ctx.lineTo(h0[0] + (h0[3] || 0), h0[1] + (h0[4] || 0)); ctx.stroke();
      ctx.setLineDash([]);
    }
    const h = hz(h0, simT), rot = T * (i % 2 ? 1.4 : -1.4);
    ctx.globalCompositeOperation = "lighter"; ctx.fillStyle = "rgba(255,77,120,.22)"; ctx.beginPath(); ctx.arc(h[0], h[1], h[2] + 9 + 2 * Math.sin(T * 5 + i), 0, 7); ctx.fill(); ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#ff4d78";
    for (let s = 0; s < 8; s++) {
      const a = rot + s * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(h[0] + Math.cos(a - .3) * h[2], h[1] + Math.sin(a - .3) * h[2]);
      ctx.lineTo(h[0] + Math.cos(a) * (h[2] + 8), h[1] + Math.sin(a) * (h[2] + 8));
      ctx.lineTo(h[0] + Math.cos(a + .3) * h[2], h[1] + Math.sin(a + .3) * h[2]);
      ctx.fill();
    }
    const hg = ctx.createRadialGradient(h[0] - 3, h[1] - 3, 1, h[0], h[1], h[2]);
    hg.addColorStop(0, "#ff9aa8"); hg.addColorStop(1, "#e0245e");
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(h[0], h[1], h[2], 0, 7); ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(h[0] - h[2] * .32, h[1] - h[2] * .1, h[2] * .2, 0, 7); ctx.arc(h[0] + h[2] * .32, h[1] - h[2] * .1, h[2] * .2, 0, 7); ctx.fill();
    ctx.fillStyle = "#3a0a1a";
    ctx.beginPath(); ctx.arc(h[0] - h[2] * .32, h[1] - h[2] * .06, h[2] * .09, 0, 7); ctx.arc(h[0] + h[2] * .32, h[1] - h[2] * .06, h[2] * .09, 0, 7); ctx.fill();
  });

  // traits du joueur
  for (const s of strokes) {
    if (s.length === 1) { ctx.fillStyle = w.ink; ctx.beginPath(); ctx.arc(s[0][0], s[0][1], STROKE / 2, 0, 7); ctx.fill(); continue; }
    ctx.beginPath(); ctx.moveTo(s[0][0], s[0][1]);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i][0], s[i][1]);
    ctx.globalAlpha = .2; ctx.strokeStyle = w.ink; ctx.lineWidth = STROKE + 9; ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = STROKE; ctx.stroke();
    ctx.globalAlpha = .55; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke(); ctx.globalAlpha = 1;
  }

  // traînée
  for (let i = 0; i < trail.length; i++) {
    const k = i / trail.length;
    ctx.globalAlpha = k * .35; ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(trail[i][0], trail[i][1], R * (.35 + .55 * k), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (phase !== 3 && phase !== 4) drawBall();
  drawParts();
  ctx.restore();
}

function drawBall() {
  const sp = Math.hypot(ball.vx, ball.vy);
  let sc = ball.spawn < 1 ? easeOutBack(ball.spawn) : 1;
  if (phase === 2) {
    const k = Math.min(1, phaseT / .55);
    ball.x = winFrom[0] + (L.goal[0] - winFrom[0]) * easeOut(k);
    ball.y = winFrom[1] + (L.goal[1] - winFrom[1]) * easeOut(k);
    sc *= 1 - .7 * k;
  }
  ctx.save(); ctx.translate(ball.x, ball.y); ctx.scale(sc, sc);
  ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = .28; ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(0, 0, R + 5, 0, 7); ctx.fill(); ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  if ((ball.sq || 0) > .02) { ctx.rotate(ball.sqa); ctx.scale(1 - ball.sq, 1 + ball.sq * .9); ctx.rotate(-ball.sqa); }
  else if (sp > 220) { const a = Math.atan2(ball.vy, ball.vx), st = Math.min(.2, sp / 3600); ctx.rotate(a); ctx.scale(1 + st, 1 - st * .8); ctx.rotate(-a); }
  const bg = ctx.createRadialGradient(-3, -4, 1, 0, 0, R + 1); bg.addColorStop(0, "#ffffff"); bg.addColorStop(1, "#c9d2ff");
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(30,30,90,.35)"; ctx.lineWidth = 1.4; ctx.stroke();
  // yeux
  let lx = phase === 1 ? ball.vx : L.goal[0] - ball.x, ly = phase === 1 ? ball.vy : L.goal[1] - ball.y;
  const ll = Math.hypot(lx, ly) || 1; lx /= ll; ly /= ll;
  ctx.strokeStyle = "#22224a"; ctx.fillStyle = "#22224a"; ctx.lineWidth = 1.7;
  if (phase === 2) {
    for (const ex of [-3.6, 3.6]) { ctx.beginPath(); ctx.arc(ex, -.5, 2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 2.5, 3, .15, Math.PI - .15); ctx.stroke();
  } else if ((T % 3.4) < .12) {
    for (const ex of [-3.6, 3.6]) { ctx.beginPath(); ctx.moveTo(ex - 1.8, -1); ctx.lineTo(ex + 1.8, -1); ctx.stroke(); }
  } else {
    for (const ex of [-3.6, 3.6]) {
      ctx.beginPath(); ctx.arc(ex + lx * 1.2, -1 + ly * 1.2, 2, 0, 7); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex + lx * 1.2 - .6, -1.7 + ly * 1.2, .7, 0, 7); ctx.fill(); ctx.fillStyle = "#22224a";
    }
    if (sp > 520) { ctx.beginPath(); ctx.ellipse(0, 4, 1.6, 2.1, 0, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}

/* ---------- Toast ---------- */
let tt;
function toast(msg, ok) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("ok", !!ok); t.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1700);
}

/* ---------- Démarrage ---------- */
$("guest").onclick = () => { user = null; store.del("tr_user"); Snd.pop(); showMenu(); };
$("logout").onclick = () => { logout(); initGoogle(); };
$("privacy").onclick = () => window.open(CFG.PRIVACY_URL, "_blank");
$("adprefs").onclick = () => { try { Plug("AdMob").showPrivacyOptionsForm(); } catch (e) {} };
user = store.get("tr_user");
if (user) { showMenu(); Cloud.resume(); } else { show("login"); initGoogle(); }
Ads.init();
if (CFG.ADS.enabled !== true) $("bonus").classList.add("hidden");
</script>
